name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: lint, typecheck, test, build, e2e, audit
    runs-on: ubuntu-latest
    # Without this, a stuck step (measured: "Install Playwright browsers"
    # hung 3.5h+ on 2026-08-19, run 32210132669 — GitHub's own default is
    # 360 minutes) burns Actions minutes silently instead of failing loud.
    timeout-minutes: 15

    # A REAL PostgreSQL, on purpose. The attribution schema pushes its
    # rules (no raw session token, no free-text UTM, no query string in a
    # page path) down into CHECK constraints, and a stub store would
    # cheerfully accept every row those constraints exist to refuse. Running
    # the suite against a fake would turn "the database protects this data"
    # into an untested claim while the suite stayed green.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yula_attribution_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (vitest, incl. real-Postgres attribution suite)
        run: pnpm test
        env:
          ATTRIBUTION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yula_attribution_test

      - name: Public claim / forbidden-pattern scan
        run: pnpm verify:claims:local

      - name: Public registry structural validation (Y-P0-003)
        run: pnpm verify:claims

      - name: Public link well-formedness + reachability (informational unless --strict)
        run: pnpm verify:links

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (playwright)
        run: pnpm test:e2e

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Dependency audit (production, high+)
        run: pnpm audit --prod --audit-level high
