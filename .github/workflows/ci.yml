name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: lint, typecheck, test, build, e2e, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Public claim / forbidden-pattern scan
        run: pnpm verify:claims:local

      - name: Public registry structural validation (Y-P0-003)
        run: pnpm verify:claims

      - name: Public link well-formedness + reachability (informational unless --strict)
        run: pnpm verify:links

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (playwright)
        run: pnpm test:e2e

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Dependency audit (production, high+)
        run: pnpm audit --prod --audit-level high
