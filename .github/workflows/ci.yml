name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: lint, typecheck, test, build, e2e, audit
    runs-on: ubuntu-latest
    # Without this, a stuck step (measured: "Install Playwright browsers"
    # hung 3.5h+ on 2026-08-19, run 32210132669 — GitHub's own default is
    # 360 minutes) burns Actions minutes silently instead of failing loud.
    # The high-tier WebGL smoke test deliberately compiles the real glass
    # shader in software-rendered CI. Keep the suite serial to avoid GPU
    # context starvation, and budget enough time for that honest render.
    timeout-minutes: 30

    # A REAL PostgreSQL, on purpose. The attribution schema pushes its
    # rules (no raw session token, no free-text UTM, no query string in a
    # page path) down into CHECK constraints, and a stub store would
    # cheerfully accept every row those constraints exist to refuse. Running
    # the suite against a fake would turn "the database protects this data"
    # into an untested claim while the suite stayed green.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yula_attribution_test
          # CI-only: this disposable service is reachable only on the runner's
          # localhost/service network. Tests create passwordless LOGIN roles so
          # they can exercise the real GRANT/RLS boundary without production credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # The privacy-claim anchor and the forbidden-pattern scan both span
      # BOTH repos: the page states collection is off, and the links hub is
      # where it would actually be switched on. Without the sibling checkout
      # that cross-repo check cannot run — and the first version of this
      # workflow shipped a test that simply crashed with ENOENT here, which
      # is at least louder than the silent skip it replaced, but is not a
      # check. yulalab-links is public, so no credentials are needed.
      - name: Check out the links hub as a sibling
        run: git clone --depth 1 --branch develop https://github.com/kocakkmustafa/yulalab-links.git ../links

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (vitest, incl. real-Postgres attribution suite)
        run: pnpm test
        env:
          # CI-only: route tests use USER as the local administrative DB role;
          # the disposable service's matching role is postgres, not runner.
          USER: postgres
          ATTRIBUTION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yula_attribution_test

      - name: Public claim / forbidden-pattern scan
        run: pnpm verify:claims:local

      - name: Public registry structural validation (Y-P0-003)
        run: pnpm verify:claims

      - name: Public link well-formedness + reachability (informational unless --strict)
        run: pnpm verify:links

      - name: Build
        run: pnpm build

      # After the build, because it reads the build output. The unit guard
      # reads the source (what Next parses) and runs earlier; this observes
      # the artifact, which is the only place the effect is directly visible.
      - name: Product pages revalidate (claim freshness is not frozen at build)
        run: pnpm verify:render-mode

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (playwright)
        run: pnpm test:e2e

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Dependency audit (production, high+)
        run: pnpm audit --prod --audit-level high
